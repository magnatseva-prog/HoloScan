<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f4efe4">
  <title>HoloScan</title>
  <link rel="stylesheet" href="css/app.css">
  <!-- тема до первой отрисовки, чтобы не мигало светлым -->
  <script>try { var th = (JSON.parse(localStorage.getItem('holoscan.settings.v1')) || {}).theme || 'auto'; document.documentElement.dataset.theme = th === 'dark' || (th === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; } catch (e) {}</script>
  <script src="vendor/tesseract.min.js"></script>
  <script src="vendor/ort/ort.wasm.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="logo"><span class="logo-mark"></span>HoloScan</div>
    <div class="top-acts">
    <button id="settings-btn" class="icon-btn" data-i18n-aria="set.title"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
  </header>

  <main>
    <!-- Каталог: карты / сеты / запечатанные -->
    <section id="v-catalog" class="view active">
      <div class="seg" id="cat-seg">
        <button data-seg="cards" class="sel" data-i18n="seg.cards"></button>
        <button data-seg="sets" data-i18n="seg.sets"></button>
        <button data-seg="sealed" data-i18n="seg.sealed"></button>
      </div>
      <div id="cat-cards" class="segpane">
        <div class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="q" type="search" data-i18n-ph="search.ph" autocomplete="off">
        </div>
        <div id="cat-status" class="status"></div>
        <div id="grid" class="grid"></div>
      </div>
      <div id="cat-sets" class="segpane" hidden>
        <div class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="sq" type="search" data-i18n-ph="sets.search" autocomplete="off">
        </div>
        <div id="setlist" class="setlist"></div>
      </div>
      <div id="cat-sealed" class="segpane" hidden>
        <div class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="sealq" type="search" data-i18n-ph="sealed.search" autocomplete="off">
        </div>
        <div id="sealkinds" class="chips scroll"></div>
        <div id="sealgrid" class="grid"></div>
      </div>
    </section>

    <!-- Оценка состояния -->
    <section id="v-grade" class="view">
      <div class="grade-hero">
        <div class="grade-badge big">PSA</div>
        <h2 data-i18n="grade.title"></h2>
        <p data-i18n="grade.intro"></p>
        <button class="btn wide" id="grade-shoot" data-i18n="grade.shoot"></button>
        <label class="btn ghost wide center-text"><input id="grade-gallery" type="file" accept="image/*" hidden><span data-i18n="grade.gallery"></span></label>
      </div>
      <div class="sec" data-i18n="grade.tipsTitle"></div>
      <ul class="pay-list tips" id="grade-tips"></ul>
      <div class="sec" id="grade-hist-h" data-i18n="grade.history"></div>
      <div id="grade-hist" class="plist"></div>
    </section>

    <!-- Коллекция: стоимость и график, все / папки / желания -->
    <section id="v-portfolio" class="view">
      <div class="worth">
        <div class="worth-label" data-i18n="coll.worth"></div>
        <div id="worth" class="worth-value">$0.00</div>
        <div id="worth-change" class="worth-change"></div>
        <div id="chart" class="chart"></div>
        <div id="ranges" class="ranges"></div>
        <div class="worth-foot"><span id="worth-sub" class="worth-sub"></span><button id="refresh" class="pill" data-i18n="coll.refresh"></button></div>
      </div>
      <div class="seg" id="coll-seg">
        <button data-seg="all" class="sel" data-i18n="seg.all"></button>
        <button data-seg="binders" data-i18n="seg.binders"></button>
        <button data-seg="wish" data-i18n="seg.wish"></button>
      </div>
      <div id="coll-all" class="segpane">
        <div id="movers"></div>
        <div id="plist" class="plist"></div>
        <div id="pempty" class="empty">
          <div class="empty-ico"></div>
          <p data-i18n="coll.empty"></p>
          <div class="row"><button class="btn" data-go="scan" data-i18n="btn.scan"></button><button class="btn ghost" data-go="catalog" data-i18n="btn.catalog"></button></div>
        </div>
      </div>
      <div id="coll-binders" class="segpane" hidden></div>
      <div id="coll-wish" class="segpane" hidden></div>
    </section>
  </main>

  <nav class="tabs">
    <button data-go="catalog" class="active"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="9" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/><rect x="14" y="15" width="7" height="6" rx="1.5"/></svg><span data-i18n="tab.catalog"></span></button>
    <button data-go="grade"><svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg><span data-i18n="tab.grade"></span></button>
    <button data-go="scan" class="scan-tab"><span><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="8" y="7" width="8" height="10" rx="1"/></svg></span></button>
    <button data-go="portfolio"><svg viewBox="0 0 24 24"><path d="M4 7h16v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg><span data-i18n="tab.collection"></span></button>
    <button data-go="trade" id="trade-btn"><svg viewBox="0 0 24 24"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg><span data-i18n="tab.trade"></span></button>
  </nav>

  <!-- Сканер -->
  <section id="scanner" class="scanner" hidden>
    <div class="scan-top">
      <button id="scan-close" class="icon-btn" aria-label="Back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="logo"><span class="logo-mark"></span>HoloScan</div>
      <div class="scan-acts"><button id="collect-all" class="pill" hidden data-i18n="btn.collectAll"></button></div>
    </div>
    <div class="viewfinder">
      <video id="video" playsinline muted autoplay></video>
      <div id="guide" class="guide"><button id="torch" class="icon-btn torch" hidden aria-label="Torch"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg></button></div>
      <div id="cam-msg" class="cam-msg" hidden></div>
      <div id="auto-hint" class="auto-hint" hidden></div>
      <div id="grade-banner" class="grade-banner" hidden></div>
    </div>
    <div class="scan-bottom">
      <div id="tray" class="tray"><div class="tray-hint" data-i18n="scan.hint"></div></div>
      <div class="controls">
        <label class="icon-btn round" aria-label="Gallery"><input id="gallery" type="file" accept="image/*" hidden><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 17-5-5-9 8"/></svg></label>
        <button id="shutter" class="shutter" aria-label="Shutter"></button>
        <button class="icon-btn round" data-go="portfolio" data-i18n-aria="tab.collection"><svg viewBox="0 0 24 24"><path d="M4 7h16v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg><b id="coll-badge" hidden>0</b></button>
      </div>
    </div>
  </section>

  <!-- Карточка / совпадение -->
  <section id="sheet" class="sheet" hidden>
    <div class="sheet-top">
      <button id="sheet-close" class="icon-btn" aria-label="Back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="sheet-title" id="sheet-title"></div>
      <span></span>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <!-- Общая панель: сет, запечатанный товар, папка -->
  <section id="panel" class="sheet panel" hidden>
    <div class="sheet-top">
      <button id="panel-close" class="icon-btn" aria-label="Back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="sheet-title" id="panel-title"></div>
      <span id="panel-act"></span>
    </div>
    <div class="sheet-body" id="panel-body"></div>
  </section>

  <!-- Маленькое окно: выбор папки, ввод названия или цены -->
  <div id="modal" class="modal" hidden><div class="modal-box" id="modal-box"></div></div>

  <div id="manual" class="sheet" hidden>
    <div class="sheet-top">
      <button id="manual-close" class="icon-btn"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="sheet-title" data-i18n="sheet.manual"></div><span></span>
    </div>
    <div class="sheet-body">
      <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="mq" type="search" data-i18n-ph="manual.ph"></div>
      <div id="mgrid" class="grid"></div>
    </div>
  </div>

  <div id="settings" class="sheet" hidden>
    <div class="sheet-top">
      <button id="settings-close" class="icon-btn"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="sheet-title" data-i18n="set.title"></div><span></span>
    </div>
    <div class="sheet-body" id="settings-body"></div>
  </div>

  <div id="celebrate" class="celebrate" hidden>
    <div class="burst"></div>
    <h2 data-i18n="first.title"></h2>
    <div class="medal"></div>
    <p class="big" data-i18n="first.congrats"></p>
    <p data-i18n="first.sub"></p>
  </div>

  <!-- Обучение при первом запуске -->
  <section id="tutorial" class="tutorial" hidden></section>

  <div id="toast" class="toast" hidden></div>
</body>
</html>
